<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#F2EBD9">
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="image_src" href="{{OG_IMAGE}}">
  <link rel="preload" as="image" href="{{STRIP_IMAGE_SRC}}">

  <meta property="og:site_name" content="Yapchik Juice">
  <meta property="og:type" content="{{OG_TYPE}}">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{OG_TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">
  {{ARTICLE_META}}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Handlee&family=JetBrains+Mono:wght@500&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v={{CSS_VERSION}}">
  <style>:root { {{WASH_COLORS}} }</style>
  <script>
    // A strip change leaves the outgoing page under a watercolor wash. Claim it
    // here, before the body paints, so the incoming page starts already covered,
    // and carry the travel direction over so the new strip arrives from its side.
    try {
      var direction = sessionStorage.getItem("yj-strip-transition");
      if (direction) {
        var travel = { right: "-7vw", left: "7vw", none: "0px" };
        document.documentElement.style.setProperty("--travel-x", travel[direction] || "0px");
        document.documentElement.setAttribute("data-transition", "enter");
        sessionStorage.removeItem("yj-strip-transition");
      }
    } catch (e) {}
  </script>
  <script type="application/ld+json">{{JSON_LD}}</script>
  {{ANALYTICS}}
</head>
<body data-strip-number="{{NUMBER}}" data-last-number="{{LAST_NUMBER}}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="strip-wash" aria-hidden="true"></div>
{{MASTHEAD}}

  <main class="page" id="main-content" tabindex="-1">
    <article class="strip" aria-labelledby="strip-title">
      <div class="strip__meta">
        <h1 id="strip-title" class="strip__title">{{STRIP_TITLE}}</h1>
        <p id="strip-number" class="strip__number">{{STRIP_NUMBER}}</p>
      </div>

      <figure class="strip__figure">
        <img id="strip-image" class="strip__image" src="{{STRIP_IMAGE_SRC}}" alt="{{STRIP_IMAGE_ALT}}" width="{{IMAGE_WIDTH}}" height="{{IMAGE_HEIGHT}}">
      </figure>

      <nav class="strip-nav" id="strip-nav" aria-label="Strip navigation" data-nosnippet>
        <a class="nav-btn" id="nav-first" href="{{NAV_FIRST_HREF}}" aria-label="First strip" title="First strip"{{NAV_FIRST_DISABLED}}>|&lt;</a>
        <a class="nav-btn" id="nav-prev" href="{{NAV_PREV_HREF}}" aria-label="Previous strip" title="Previous strip"{{NAV_PREV_DISABLED}}>&lt;</a>
        <a class="nav-btn nav-btn--random" id="nav-random" href="{{NAV_RANDOM_HREF}}" aria-label="Random strip" title="Random strip"><span class="qmark qmark--one">?</span><span class="qmark qmark--two">?</span><span class="qmark qmark--three">?</span></a>
        <a class="nav-btn" id="nav-next" href="{{NAV_NEXT_HREF}}" aria-label="Next strip" title="Next strip"{{NAV_NEXT_DISABLED}}>&gt;</a>
        <a class="nav-btn" id="nav-last" href="{{NAV_LAST_HREF}}" aria-label="Last strip" title="Last strip"{{NAV_LAST_DISABLED}}>&gt;|</a>
      </nav>

      <p class="strip__hint" data-nosnippet>Use the <kbd>&larr;</kbd> and <kbd>&rarr;</kbd> keys to move between strips.</p>
    </article>
  </main>

  <footer class="footer" data-nosnippet>
    <p>&copy; <span id="year">2026</span> YapchikJuice.com</p>
  </footer>

  <dialog class="signup-dialog" id="signup-dialog" aria-label="Subscribe to Yapchik Juice">
    <div class="signup-dialog__top">
      <button type="button" class="signup-dialog__close" aria-label="Close signup">&times;</button>
    </div>
    <script async src="https://subscribe-forms.beehiiv.com/v3/loader.js" data-beehiiv-form="116a86e5-fc6f-4a7d-9a61-2089c1f883ae"></script>
  </dialog>

  <script src="/app.js"></script>
  <script type="text/javascript" async src="https://subscribe-forms.beehiiv.com/attribution.js"></script>
</body>
</html>
